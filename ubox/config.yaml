name: UBox Camera
version: "0.6"
slug: ubox
description: UBox camera live H.265 stream, pure local, on-demand (starts qemu pipeline only while viewing)
url: https://github.com/wocaca/hass-ubox
arch:
  - amd64
  - aarch64
startup: application
boot: auto
host_network: true
hassio_api: false
homeassistant_api: false
privileged:
  - NET_ADMIN
full_access: false
apparmor: true
map: []
# All runtime knobs live inside the container web UI (persisted under /data);
# Add-on options intentionally empty so no secrets touch HASS config.
options: {}
schema: {}
ports_description:
  8089/tcp: Live MJPEG + snapshots + status
image: ghcr.io/wocaca/{arch}-addon-ubox
