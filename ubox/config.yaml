name: UBox Camera
version: "0.6.4"
slug: ubox
description: UBox camera live H.265 stream, pure local, on-demand (starts qemu pipeline only while viewing)
url: https://github.com/wocaca/hass-ubox
arch:
  - amd64
  - aarch64
startup: application
boot: auto
host_network: true
hassio_api: false
homeassistant_api: false
privileged:
  - NET_ADMIN
full_access: false
apparmor: true
map: []
# Page protection (Basic auth on :8089). Empty password = open.
# This tab is authoritative: on (re)start these two win over page-side edits.
options:
  http_username: ubox
  http_password: ""
schema:
  http_username: str
  http_password: password
ports_description:
  8089/tcp: Live MJPEG + snapshots + status
image: ghcr.io/wocaca/{arch}-addon-ubox
