name: UBox Camera
version: 0.1.0
slug: ubox
description: UBox camera live H.265 stream, pure local, on-demand (starts qemu pipeline only while viewing)
url: https://github.com/wocaca/hass-ubox
arch:
  - amd64
  - aarch64
startup: application
boot: auto
host_network: true
hassio_api: false
homeassistant_api: false
privileged: []
full_access: false
apparmor: true
map: []
options:
  uid: ""
  username: admin
  password: ""
  stream: 1
  fps: 8
  port: 8089
  idle_timeout: 60
schema:
  uid: str
  username: str
  password: password
  stream: int(0,1)
  fps: int(1,15)
  port: port
  idle_timeout: int(15,600)
ports_description:
  8089/tcp: Live MJPEG + snapshots + status
image: ghcr.io/wocaca/{arch}-addon-ubox
