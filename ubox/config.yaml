name: UBox Camera
version: "0.4"
slug: ubox
description: UBox camera live H.265 stream, pure local, on-demand (starts qemu pipeline only while viewing)
url: https://github.com/wocaca/hass-ubox
arch:
  - amd64
  - aarch64
startup: application
boot: auto
host_network: true
hassio_api: false
homeassistant_api: false
privileged:
  - NET_ADMIN
full_access: false
apparmor: true
map: []
options:
  uid: ""
  username: admin
  password: ""
  stream: 1
  fps: 8
  port: 8089
  idle_timeout: 60
  transport: auto
  http_username: ubox
  http_password: ""
  cloud_account: ""
  cloud_password: ""
  cloud_region: us
schema:
  uid: str
  username: str
  password: password
  stream: int(0,1)
  fps: int(1,15)
  port: port
  idle_timeout: int(15,600)
  transport: list(auto|relay|direct)
  http_username: str
  http_password: password
  cloud_account: str
  cloud_password: password
  cloud_region: list(cn|us|uni)
ports_description:
  8089/tcp: Live MJPEG + snapshots + status
image: ghcr.io/wocaca/{arch}-addon-ubox
