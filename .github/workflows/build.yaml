name: build-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Add-on version (must match ubox/config.yaml)
        required: true
        default: 0.1.0

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ubox
          platforms: linux/${{ matrix.arch }}
          build-args: BUILD_FROM=python:3.12-slim-bookworm
          push: true
          tags: ghcr.io/wocaca/${{ matrix.arch }}-addon-ubox:${{ env.VERSION }}
